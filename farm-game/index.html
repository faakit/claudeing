<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="data:," />
    <title>Tiny Acre</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1c2c;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #1a1c2c;
        color: #f4ead2;
        font: 16px/1.4 monospace;
        text-align: center;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      @media (orientation: portrait) and (max-width: 700px) {
        #rotate {
          display: flex;
        }
      }
      #game {
        position: fixed;
        inset: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Please rotate your device to landscape to play Tiny Acre.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
