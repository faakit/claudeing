<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1c2c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tiny Acre" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Tiny Acre</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1c2c;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #1a1c2c;
        color: #f4ead2;
        font: 16px/1.4 monospace;
        text-align: center;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      @media (orientation: landscape) and (max-height: 520px) {
        #rotate {
          display: flex;
        }
      }
      /* The frame carries the safe-area padding; Phaser fits the canvas inside #game, whose size is
         the padded content box. (Padding on the Phaser parent itself is ignored by its size maths.) */
      #frame {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      #game {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="frame"><div id="game"></div></div>
    <div id="rotate">Please turn your phone upright to play Tiny Acre.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
