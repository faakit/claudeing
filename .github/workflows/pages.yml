name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/repo-code-github-pages-3ukz7j
      - ccr-57a7430b-tj2108
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Set up Node (for the farm game build)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: farm-game/package-lock.json
      - name: Build farm game
        working-directory: farm-game
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Assemble site (existing app at / and the farm game at /farm/)
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='_site' --exclude='farm-game' ./ _site/
          mkdir -p _site/farm
          cp -r farm-game/dist/. _site/farm/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
